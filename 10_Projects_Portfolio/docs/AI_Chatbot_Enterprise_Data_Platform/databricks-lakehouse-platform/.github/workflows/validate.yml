name: validate
on:
  pull_request:
  push:
    branches: [main]

jobs:
  repository-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required architecture files
        run: |
          test -f README.md
          test -f docs/architecture/HIGH_LEVEL_ARCHITECTURE.md
          test -f docs/architecture/END_TO_END_FLOW.md
          test -f docs/stakeholder/CDO_EXECUTIVE_BRIEF.md
          test -f resources/images/databricks-production-architecture.png
