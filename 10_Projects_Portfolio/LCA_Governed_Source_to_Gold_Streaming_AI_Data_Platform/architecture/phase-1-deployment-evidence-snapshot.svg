<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Phase 1 ECS Fargate deployment evidence</title>
  <desc id="desc">Verified Coinbase WebSocket to ECS Fargate Python adapter to Kinesis flow, with ECR, IAM and CloudWatch evidence. Firehose and S3 Bronze remain next.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#edf4fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#12375b" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#0c9b77"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="76" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#102c46">PHASE 1 — VERIFIED AWS RUNTIME CHECKPOINT</text>
  <text x="80" y="116" font-family="Arial, sans-serif" font-size="20" fill="#4e6680">Coinbase → ECS/Fargate Python adapter → Kinesis Data Streams</text>

  <g filter="url(#shadow)">
    <rect x="70" y="190" width="330" height="280" rx="26" fill="#fff" stroke="#2869e6" stroke-width="4"/>
    <circle cx="235" cy="265" r="48" fill="#2869e6"/>
    <text x="235" y="279" text-anchor="middle" font-family="Arial" font-size="42" font-weight="700" fill="#fff">C</text>
    <text x="235" y="344" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#102c46">Coinbase WebSocket</text>
    <text x="235" y="385" text-anchor="middle" font-family="Arial" font-size="19" fill="#50657a">Public market-trades channel</text>
    <text x="235" y="420" text-anchor="middle" font-family="Arial" font-size="19" fill="#0b8b69">✓ connecting</text>
    <text x="235" y="448" text-anchor="middle" font-family="Arial" font-size="19" fill="#0b8b69">✓ subscribed</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="485" y="150" width="610" height="360" rx="30" fill="#eaf4ff" stroke="#173a63" stroke-width="5"/>
    <text x="790" y="202" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#102c46">Amazon ECS Service</text>
    <text x="790" y="232" text-anchor="middle" font-family="Arial" font-size="19" fill="#42617d">1 desired · 1 running · 0 pending</text>
    <rect x="545" y="260" width="490" height="205" rx="24" fill="#effcf7" stroke="#0c9b77" stroke-width="4"/>
    <text x="790" y="304" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#102c46">AWS Fargate Task</text>
    <text x="790" y="338" text-anchor="middle" font-family="Arial" font-size="18" fill="#42617d">0.25 vCPU · 0.5 GiB · Linux/X86_64</text>
    <rect x="605" y="360" width="370" height="78" rx="15" fill="#fff" stroke="#2869e6" stroke-width="3"/>
    <text x="790" y="393" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#102c46">Python Coinbase adapter</text>
    <text x="790" y="422" text-anchor="middle" font-family="Arial" font-size="17" fill="#50657a">calls kinesis:PutRecord</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1180" y="190" width="350" height="280" rx="26" fill="#fff" stroke="#7538e8" stroke-width="4"/>
    <circle cx="1355" cy="265" r="48" fill="#7538e8"/>
    <text x="1355" y="278" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#fff">KDS</text>
    <text x="1355" y="344" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#102c46">Amazon Kinesis</text>
    <text x="1355" y="380" text-anchor="middle" font-family="Arial" font-size="19" fill="#50657a">encrypted · one shard</text>
    <text x="1355" y="416" text-anchor="middle" font-family="Arial" font-size="19" fill="#0b8b69">✓ PutRecord.Success = 1</text>
    <text x="1355" y="446" text-anchor="middle" font-family="Arial" font-size="19" fill="#0b8b69">✓ latency ≈ 4.3 ms</text>
  </g>

  <line x1="400" y1="330" x2="485" y2="330" stroke="#0c9b77" stroke-width="10" marker-end="url(#arrow)"/>
  <text x="442" y="309" text-anchor="middle" font-family="Arial" font-size="16" fill="#0b725a">live JSON</text>
  <line x1="1095" y1="330" x2="1180" y2="330" stroke="#0c9b77" stroke-width="10" marker-end="url(#arrow)"/>
  <text x="1138" y="309" text-anchor="middle" font-family="Arial" font-size="16" fill="#0b725a">PutRecord</text>

  <g filter="url(#shadow)">
    <rect x="85" y="570" width="420" height="190" rx="22" fill="#fff8ed" stroke="#f29422" stroke-width="3"/>
    <text x="295" y="617" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#102c46">Amazon ECR</text>
    <text x="295" y="654" text-anchor="middle" font-family="Arial" font-size="18" fill="#50657a">phase1-v2 pinned by digest</text>
    <text x="295" y="687" text-anchor="middle" font-family="Arial" font-size="18" fill="#0b8b69">✓ security scan: zero findings</text>
    <text x="295" y="720" text-anchor="middle" font-family="Arial" font-size="17" fill="#50657a">execution role permits image pull</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="590" y="570" width="420" height="190" rx="22" fill="#f7f1ff" stroke="#7538e8" stroke-width="3"/>
    <text x="800" y="617" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#102c46">IAM role separation</text>
    <text x="800" y="654" text-anchor="middle" font-family="Arial" font-size="18" fill="#50657a">Task role → Python writes to Kinesis</text>
    <text x="800" y="687" text-anchor="middle" font-family="Arial" font-size="18" fill="#50657a">Execution role → ECR + CloudWatch</text>
    <text x="800" y="720" text-anchor="middle" font-family="Arial" font-size="18" fill="#50657a">Service-linked role → ECS control plane</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1095" y="570" width="420" height="190" rx="22" fill="#effcf7" stroke="#0c9b77" stroke-width="3"/>
    <text x="1305" y="617" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#102c46">Amazon CloudWatch</text>
    <text x="1305" y="654" text-anchor="middle" font-family="Arial" font-size="18" fill="#50657a">/ecs/lca-coinbase-adapter-task-dev</text>
    <text x="1305" y="687" text-anchor="middle" font-family="Arial" font-size="18" fill="#0b8b69">✓ coinbase_connecting</text>
    <text x="1305" y="720" text-anchor="middle" font-family="Arial" font-size="18" fill="#0b8b69">✓ coinbase_subscribed</text>
  </g>

  <rect x="70" y="812" width="1460" height="56" rx="18" fill="#15395f"/>
  <text x="800" y="848" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#fff">VERIFIED: Coinbase → ECS/Fargate → Kinesis   |   NEXT: Firehose → S3 Bronze</text>
</svg>
