<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Phase 1 manual AWS build: first service</title>
  <desc id="desc">Verified Kinesis configuration and its position between the future ECS Coinbase adapter and future Firehose delivery.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#2878d0"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-opacity=".14"/></filter>
    <style>
      .title{font:700 42px Arial,sans-serif;fill:#102a43}.sub{font:24px Arial,sans-serif;fill:#526b82}.h{font:700 24px Arial,sans-serif;fill:#102a43}.b{font:20px Arial,sans-serif;fill:#334e68}.small{font:18px Arial,sans-serif;fill:#526b82}.white{fill:#fff}.center{text-anchor:middle}.card{fill:#fff;stroke:#bcccdc;stroke-width:2;rx:18;filter:url(#shadow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f4f8fb"/>
  <rect width="1600" height="14" fill="#ff9900"/>
  <text x="80" y="78" class="title">Phase 1 Manual AWS Build | First Service</text>
  <text x="80" y="120" class="sub">Amazon Kinesis Data Streams — configuration verified 11 August 2026</text>

  <rect x="80" y="170" width="340" height="174" class="card"/>
  <text x="110" y="214" class="h">Stream identity</text>
  <text x="110" y="255" class="b">lca-coinbase-</text><text x="110" y="285" class="b">market-trades-dev</text>
  <rect x="110" y="302" width="94" height="28" rx="14" fill="#d9f7e8"/><text x="157" y="323" class="small center" fill="#087f5b">ACTIVE</text>

  <rect x="450" y="170" width="340" height="174" class="card"/>
  <text x="480" y="214" class="h">Capacity</text>
  <text x="480" y="258" class="b">Provisioned mode</text>
  <text x="480" y="296" class="b">1 shard</text>
  <text x="480" y="325" class="small">Fixed capacity for learning/dev</text>

  <rect x="820" y="170" width="340" height="174" class="card"/>
  <text x="850" y="214" class="h">One-shard write limits</text>
  <text x="850" y="258" class="b">≤ 1 MiB/second AND</text>
  <text x="850" y="296" class="b">≤ 1,000 records/second</text>
  <text x="850" y="325" class="small">Either limit can cause throttling</text>

  <rect x="1190" y="170" width="330" height="174" class="card"/>
  <text x="1220" y="214" class="h">Retention</text>
  <text x="1220" y="258" class="b">1 day = 24 hours</text>
  <text x="1220" y="296" class="small">Measured per record from</text>
  <text x="1220" y="324" class="small">its arrival in Kinesis</text>

  <text x="80" y="426" class="h">Where this service fits</text>
  <rect x="90" y="480" width="300" height="142" rx="20" fill="#e8f1fb" stroke="#78a9dc" stroke-width="2"/>
  <text x="240" y="530" class="h center">Coinbase WebSocket</text>
  <text x="240" y="570" class="small center">creates live source messages</text>
  <text x="240" y="600" class="small center">NOT CONNECTED YET</text>

  <path d="M390 551 H510" stroke="#2878d0" stroke-width="8" marker-end="url(#arrow)"/>
  <rect x="530" y="480" width="300" height="142" rx="20" fill="#fff4db" stroke="#ffb84d" stroke-width="2"/>
  <text x="680" y="530" class="h center">ECS adapter</text>
  <text x="680" y="570" class="small center">will write unchanged JSON</text>
  <text x="680" y="600" class="small center">NOT DEPLOYED YET</text>

  <path d="M830 551 H950" stroke="#2878d0" stroke-width="8" marker-end="url(#arrow)"/>
  <rect x="970" y="465" width="300" height="172" rx="20" fill="#6b45bc"/>
  <text x="1120" y="518" class="h white center">Kinesis stream</text>
  <text x="1120" y="560" class="b white center">buffers ordered records</text>
  <text x="1120" y="600" class="b white center">ACTIVE + ENCRYPTED</text>

  <path d="M1270 551 H1370" stroke="#2878d0" stroke-width="8" marker-end="url(#arrow)"/>
  <rect x="1390" y="480" width="150" height="142" rx="20" fill="#e6f6f2" stroke="#35b69f" stroke-width="2"/>
  <text x="1465" y="530" class="h center">Firehose</text>
  <text x="1465" y="570" class="small center">later reads</text>
  <text x="1465" y="600" class="small center">NOT CREATED</text>

  <rect x="80" y="700" width="1440" height="128" rx="18" fill="#102a43"/>
  <text x="120" y="748" class="h white">Verified now</text>
  <text x="120" y="786" class="b white">The transport service exists. No producer records or end-to-end delivery have been verified.</text>
  <text x="120" y="817" class="small white">IAM roles are verified. Next: implement the Kinesis sink, publish the image, deploy ECS and prove record delivery.</text>
</svg>
