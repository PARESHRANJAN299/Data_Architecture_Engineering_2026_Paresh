kafka {
  bootstrapServers = "localhost:9092"
  acks = "all"
  retries = 5
  lingerMs = 20
  deliveryTimeoutMs = 120000
}

openFoodFacts {
  baseUrl = "https://world.openfoodfacts.org/api/v2/search"
  pageSize = 20
  pollIntervalSeconds = 60
  fields = "code,product_name,brands,categories_tags,nutrition_grades,last_modified_t,countries_tags"
  userAgent = "PareshDatabricksPortfolio/0.1 (portfolio-project)"
}

simulator {
  intervalMillis = 1500
  customerPoolSize = 100
  startingInventory = 500
}
