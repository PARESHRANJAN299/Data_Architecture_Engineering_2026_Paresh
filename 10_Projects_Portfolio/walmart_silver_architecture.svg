<svg width="720" height="620" viewBox="0 0 720 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<rect width="720" height="620" fill="#ffffff"/>
<text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">Walmart LCA — Silver Pipeline (sandbox)</text>
<text x="360" y="50" text-anchor="middle" font-size="12" fill="#666">bronze_unilever.walmart_media_data  &#8594;  silver_unilever.walmart_media_data</text>

<text x="60" y="88" font-size="13" font-weight="bold" fill="#b8860b">BRONZE (raw sources)</text>
<line x1="60" y1="94" x2="660" y2="94" stroke="#ddd" stroke-width="1"/>

<!-- center fact -->
<rect x="255" y="108" width="210" height="58" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="360" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">fact_omni_sales</text>
<text x="360" y="151" text-anchor="middle" font-size="11" fill="#1e40af">CENTER · all sales kept</text>

<!-- sources -->
<rect x="30" y="208" width="180" height="56" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
<text x="120" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">dim_item_attributes</text>
<text x="120" y="249" text-anchor="middle" font-size="11" fill="#065f46">item details</text>

<rect x="270" y="208" width="180" height="56" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
<text x="360" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">dim_product_dimensions</text>
<text x="360" y="249" text-anchor="middle" font-size="11" fill="#065f46">product / brand</text>

<rect x="510" y="208" width="180" height="56" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="600" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">fact_ecomm_inventory</text>
<text x="600" y="246" text-anchor="middle" font-size="10" fill="#92400e">deduped: 1 row/item</text>

<!-- arrows -->
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#555"/></marker></defs>
<line x1="300" y1="166" x2="145" y2="206" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<text x="185" y="180" text-anchor="middle" font-size="10" font-weight="bold" fill="#7c3aed">LEFT · wm_item_nbr</text>
<line x1="360" y1="166" x2="360" y2="206" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<text x="440" y="190" text-anchor="middle" font-size="10" font-weight="bold" fill="#7c3aed">LEFT · catlg_item_id</text>
<line x1="420" y1="166" x2="585" y2="206" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<text x="548" y="180" text-anchor="middle" font-size="10" font-weight="bold" fill="#7c3aed">LEFT · catlg_item_id</text>

<text x="120" y="283" text-anchor="middle" font-size="10" fill="#065f46">match: 1 row/item &#10003;</text>
<text x="360" y="283" text-anchor="middle" font-size="10" fill="#065f46">match: 100% &#10003;</text>
<text x="600" y="283" text-anchor="middle" font-size="10" fill="#92400e">match: ~37% (rest NULL)</text>

<!-- transform -->
<line x1="360" y1="298" x2="360" y2="324" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="150" y="324" width="420" height="74" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="360" y="347" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b21b6">TRANSFORM (in Silver)</text>
<text x="360" y="368" text-anchor="middle" font-size="11" fill="#5b21b6">rename duplicate columns by source (keep all)</text>
<text x="360" y="385" text-anchor="middle" font-size="11" fill="#5b21b6">join keys kept once · LEFT join = no sales lost</text>

<text x="60" y="430" font-size="13" font-weight="bold" fill="#059669">SILVER (merged output)</text>
<line x1="60" y1="436" x2="660" y2="436" stroke="#ddd" stroke-width="1"/>

<line x1="360" y1="398" x2="360" y2="452" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="205" y="452" width="310" height="66" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
<text x="360" y="474" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">lca_walmart_omni_sales_sandbox</text>
<text x="360" y="493" text-anchor="middle" font-size="11" fill="#065f46">one wide row per sale · all columns kept</text>
<text x="360" y="508" text-anchor="middle" font-size="11" fill="#065f46">~126,301 rows</text>

<line x1="360" y1="518" x2="360" y2="544" stroke="#999" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)"/>
<rect x="235" y="544" width="250" height="52" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="360" y="565" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">GOLD + PPG / Brand mappers</text>
<text x="360" y="582" text-anchor="middle" font-size="10" fill="#9ca3af">(later)</text>
</svg>
